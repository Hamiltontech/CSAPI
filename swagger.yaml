openapi: 3.0.1
info:
  title: Odoo CSMENA HR Integration API
  description: API for accessing HR, Projects, Tasks, and Assignments data from Odoo
  version: 1.0.0
servers:
  - url: https://csmena-testingbranch3-38116430.dev.odoo.com/
    description: staging server
  - url: https://csmena.odoo.com
    description: Production server
    
tags:
  - name: Employees
    description: Operations related to employees
  - name: Assignments
    description: Operations related to employee assignments
  - name: Projects
    description: Operations related to projects
  - name: Tasks
    description: Operations related to tasks
  - name: Departments
    description: Operations related to departments
  - name: Jobs
    description: Operations related to job positions
  - name: Payroll
    description: Operations related to payroll & attendance.
  - name: Authintication
    description: Operations related to authintication
  - name: Time Off
    description: Operations related to employee time off, leave types, allocations, and requests

paths:
  /api/v1/employees/details:
    get:
      tags: [Employees]
      summary: Get detailed employee information
      description: Returns comprehensive details about all employees
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeDetails'

  /api/v1/employees:
    get:
      tags: [Employees]
      summary: Get employee information with active assignments
      description: Returns employee information including their active assignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeWithAssignments'

  /api/v1/Assignments:
    get:
      tags: [Assignments]
      summary: Get all assignments
      description: Returns information about all assignments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: Get all projects
      description: Returns information about all projects including their tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'

  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: Get all tasks
      description: Returns information about all tasks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'

  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: Get all job positions
      description: Returns information about all job positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'

  /api/v1/departments:
    get:
      tags: [Departments]
      summary: Get all departments
      description: Returns information about all departments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'

  /api/v1/assignment/create:
    post:
      tags: [Assignments]
      summary: Create a new assignment
      description: Creates a new employee assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '200':
          description: Assignment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/Assignment'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/assignment/{assignment_id}/update:
    put:
      tags: [Assignments]
      summary: Update an assignment
      description: Updates an existing assignment
      security:
        - bearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          description: ID of the assignment to update
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentInput'
      responses:
        '200':
          description: Assignment updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/Assignment'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Assignment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                
  /api/v1/payroll-lookups:
    get:
      tags: [Payroll]
      summary: Lookup for payroll endpoint
      description: Returns information about the payroll endpoints
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          description: type of the lookup values requested
          required: true
          schema:
            type: string
            # default: all
            enum:
              - work_entry
              - allowance
              - deduction
              - salary_structure
              - time_off
              - shift
              - all
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/PayrollLookups'
      
  /api/v1/schedule/upsert:
    post:
      tags: [Payroll]
      summary: Schedule a timeslot
      description: Records a scheduled timeslot where an employee works on a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/Schedule'
      
  /api/v1/attendance/create:
    post:
      tags: [Payroll]
      summary: Record the attendence of an employee
      description: Creates a record of when an employee had checked-in & checked-out
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceInput'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/Attendance'

  /api/v1/work-entry/batch:
    post:
      summary: Create multiple work entries with benefits
      description: |
        Creates multiple work entries for an employee and optionally attaches fixed allowances/deductions.
        All work entries in the batch will have the same effective_date if provided.
      operationId: createWorkEntryBatch
      tags:
        - Work Entries
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkEntryBatchRequest"
            examples:
              jordan_employee:
                summary: Jordan Employee Example
                value:
                  employee_id: 10000
                  effective_date: "2025-10-25"
                  attendance:
                    - start: "2025-10-25 23:00:00"
                      end: "2025-10-26 09:00:00"
                      workentry_type_id: 1
                    - start: "2025-10-26 23:00:00"
                      end: "2025-10-27 09:00:00"
                      workentry_type_id: 1
                  work_entry_allowance:
                    - id: 1
                      factor: 1.5
                    - id: 2
                      factor: 1.0
                  work_entry_deduction:
                    - id: 5
                      factor: 2.0
      
      responses:
        "200":
          description: Work entries created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkEntryBatchResponse"
              examples:
                success_response:
                  summary: Successful Response
                  value:
                    status: "success"
                    message:
                      employee_id: 10000
                      entries:
                        - id: 12345
                          date_start: "2025-10-25 20:00:00"
                          date_stop: "2025-10-26 06:00:00"
                          work_entry_type_id: 1
                          effective_date: "2025-10-25"
                          benefits:
                            - id: 1
                              name: "Overtime Allowance"
                              classification: "allowance"
                              factor: 1.5
                              calculated_amount: 150.0
                              employee_hours: true
                              employee_hourly_rate: 25.0
                              base_amount: 100.0
                            - id: 5
                              name: "Tax Deduction"
                              classification: "deduction"
                              factor: 2.0
                              calculated_amount: 200.0
                              employee_hours: false
                              base_amount: 100.0
                          total_allowances: 150.0
                          total_deductions: 200.0
                          net_benefit: -50.0
                        - id: 12346
                          date_start: "2025-10-26 20:00:00"
                          date_stop: "2025-10-27 06:00:00"
                          work_entry_type_id: 1
                          effective_date: "2025-10-25"
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing_employee:
                  summary: Missing Employee ID
                  value:
                    status: "error"
                    message: "Missing employee_id"
                invalid_datetime:
                  summary: Invalid DateTime Format
                  value:
                    status: "error"
                    message: "Invalid datetime format in attendance item (use YYYY-MM-DD HH:MM:SS): time data 'invalid-date' does not match format '%Y-%m-%d %H:%M:%S'"
                invalid_effective_date:
                  summary: Invalid Effective Date
                  value:
                    status: "error"
                    message: "Invalid effective_date format. Use YYYY-MM-DD format"
                unsupported_country:
                  summary: Unsupported Country
                  value:
                    status: "error"
                    message: "Unsupported country: United States (US). Supported countries: Jordan (JO), Saudi Arabia (SA)"
        "404":
          description: Not Found - Employee or work entry type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                employee_not_found:
                  summary: Employee Not Found
                  value:
                    status: "error"
                    message: "Employee with ID 99999 not found"
                work_entry_type_not_found:
                  summary: Work Entry Type Not Found
                  value:
                    status: "error"
                    message: "workentry_type_id 999 not found"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                server_error:
                  summary: Server Error
                  value:
                    status: "error"
                    message: "Internal server error occurred"
  
  /api/v1/shifts/upsert:
    post:
      tags: [Payroll]
      summary: Create a shift
      description: Creates a record of a shift for a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftInput'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
  /api/v1/auth/token:
    post:
      tags: [Authintication]
      summary: Create/Update the token used by a user
      description: Creates/Updates a record of the token used by a specific user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenInput'
      responses:
        '200':
          description: Successful Operation
          headers:
            Set-Cookie:
              description: Authintication cookie 'session_id'
              schema:
                type: string
              example: "session_id=T-LXasrzqNr1vULGJ9dLu-5pmeDzkcj6diFHsvn58X6agm7GtOAXh-7Q91K3YVYS6XWK6F7kyJCN7ig4rwBP; Path=/; Secure; HttpOnly; Expires=Tue, 06 Jan 2026 07:40:41 GMT;"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthToken"
  
  /api/v1/auth/login:
    post:
      tags: [Authintication]
      summary: Returns a session id corresponding to the login token's  user account
      description: Returns a session id keeping the user logged into their account if they provide the correct token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginInput'
      responses:
        '200':
          description: Successful Operation
          headers:
            Set-Cookie:
              description: Authintication cookie 'session_id'
              schema:
                type: string
              example: "session_id=w-0uE9Wk5NTJLQnNfz61bhifJCdvsC2i0KTOTA9F2Zb0CW5Zrazte5j7K5gMzPVov3Mws9gEmrjpR1L6qWtN; Path=/; Secure; HttpOnly; Expires=Tue, 06 Jan 2026 07:13:00 GMT;"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogin"
  
  /api/v1/auth/logout:
    post:
      tags: [Authintication]
      summary: Returns a session id corresponding to the login token's  user account
      description: Returns a session id keeping the user logged into their account if they provide the correct token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutInput'
      responses:
        '200':
          description: Successful Operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogout"

  /api/v1/auth/login_redirect:
    get:
      tags: [Authintication]
      summary: Authenticate user via query parameters and redirect to Odoo portal
      description: Validates login and API token, sets the session cookie, and redirects to the Odoo portal page (default `/my`).
      parameters:
        - name: login
          in: query
          description: User login email
          required: true
          schema:
            type: string
            example: m.tamimi@csmena.com
        - name: token
          in: query
          description: User API token
          required: true
          schema:
            type: string
            example: VC5mRJIRvf-X56asMRvYQmMVvXmOjuWbB9kJlbSctbUxoupqHpsLjSMCeZQbAk7XW68TqLd7g66jJDcad-TL
        - name: redirect
          in: query
          description: Target path to redirect to after successful authentication (defaults to `/my`)
          required: false
          schema:
            type: string
            example: /portal
      responses:
        '303':
          description: Successful authentication, redirecting to the target page
          headers:
            Set-Cookie:
              description: Authentication cookie 'session_id'
              schema:
                type: string
                example: "session_id=w-0uE9Wk5NTJLQnNfz61bhifJCdvsC2i0KTOTA9F2Zb0CW5Zrazte5j7K5gMzPVov3Mws9gEmrjpR1L6qWtN; Path=/; Secure; HttpOnly;"
            Location:
              description: Target URL for redirection
              schema:
                type: string
                example: /portal
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid login credentials or inactive account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/contracts:
    get:
      tags: [Employees]
      summary: Get employee contracts
      description: Returns all contracts associated with employees. Can be filtered by employee_id or hrid.
      security:
        - bearerAuth: []
      parameters:
        - name: employee_id
          in: query
          description: Filter contracts by Employee ID
          required: false
          schema:
            type: integer
            example: 1223
        - name: hrid
          in: query
          description: Filter contracts by Employee HRID
          required: false
          schema:
            type: string
            example: 3513
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeContract'
              example:
                status: success
                message:
                  - employee_id: 1223
                    hrid: "3513"
                    contracts:
                      - id: 1
                        date_start: "2026-01-01"
                        date_end: "2026-12-31"
                        state: "open"
                        benefits: [1, 2, 3]
                        structure_type_id:
                          id: 8
                          name: "Agent Salary"
                        x_studio_contract_hours: 9
                        x_studio_ramadan_hour_1: 9.0
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/timeoff/types:
    get:
      tags: [Time Off]
      summary: Get all Time Off types
      description: |
        Lookup API to retrieve all available time off types (leave types) configured in Odoo.
        
        **Important Notes:**
        - By default, only active time off types are returned.
        - Pass `active_only=false` to include archived time off types.
      security:
        - bearerAuth: []
      parameters:
        - name: active_only
          in: query
          description: Filter active status. Set to 'false' to include archived types (defaults to true).
          required: false
          schema:
            type: boolean
            default: true
            example: true
      responses:
        '200':
          description: Successful retrieval of time off types
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeOffType'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/timeoff/allocations:
    get:
      tags: [Time Off]
      summary: Get employee time off allocations
      description: |
        Retrieves leave allocations for a specific employee or for all employees.
        
        **Key Business Scenarios & Parameters:**
        1. **Single Employee Query**:
           - Must pass either `employee_id` (Odoo database ID) or `hrid` (Company HRID).
        2. **All Employees Query**:
           - Pass `all=true` (or set `employee_id=all` / `hrid=all`) to retrieve allocations for all active employees across the entire system.
        3. **Dynamic Display Format**:
           - Allocations based on hours (`type_request_unit: hour`) return `number_of_hours_display`.
           - Allocations based on days return `number_of_days_display`.
        4. **Filtering**:
           - `state`: Filter by allocation state (e.g., `validate` for approved allocations, `confirm`, etc.).
           - `holiday_status_id`: Filter allocations by a specific time off type ID.
      security:
        - bearerAuth: []
      parameters:
        - name: employee_id
          in: query
          description: Odoo employee database ID (or 'all' to query all employees)
          required: false
          schema:
            type: string
            example: "10008"
        - name: hrid
          in: query
          description: Employee HRID (or 'all' to query all employees)
          required: false
          schema:
            type: string
            example: "22722"
        - name: all
          in: query
          description: Set to true to retrieve allocations for all employees
          required: false
          schema:
            type: boolean
            example: false
        - name: state
          in: query
          description: Filter allocations by status (e.g. validate, confirm)
          required: false
          schema:
            type: string
            example: validate
        - name: holiday_status_id
          in: query
          description: Filter allocations by Time Off Type ID
          required: false
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Successful retrieval of employee allocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeAllocation'
        '400':
          description: Missing mandatory parameters or invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Time Off]
      summary: Get employee time off allocations (POST body alternative)
      description: |
        Alternative method to query employee allocations by providing parameters in a JSON request body.
        Supports the exact same query parameters as the GET endpoint (`employee_id`, `hrid`, `all`, `state`, `holiday_status_id`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_id:
                  type: integer
                  description: Odoo employee database ID
                  example: 10008
                hrid:
                  type: string
                  description: Employee HRID
                  example: "22722"
                all:
                  type: boolean
                  description: Set to true to retrieve allocations for all employees
                  example: false
                state:
                  type: string
                  description: Filter allocations by status (e.g. validate)
                  example: validate
                holiday_status_id:
                  type: integer
                  description: Filter by Time Off Type ID
                  example: 1
      responses:
        '200':
          description: Successful retrieval of employee allocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeAllocation'
        '400':
          description: Missing mandatory parameters or invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/timeoff/upsert:
    post:
      tags: [Time Off]
      summary: Create or update (upsert) employee time off request
      description: |
        Creates a new time off request or updates an existing one, matching the business logic of Odoo's Time Off form (`hr_holidays.hr_leave_view_form`).
        
        **Important Cases & Business Rules:**
        
        1. **Create vs. Update (Upsert)**:
           - **Create**: Omit `leave_id`. Provide `employee_id` (or `hrid`), `holiday_status_id`, and requested dates/hours.
           - **Update**: Provide `leave_id` (or `id`) to update an existing `hr.leave` record. The updated duration is recalculated and re-validated.
        
        2. **Employee Identification**:
           - Supports either Odoo DB ID (`employee_id`) or corporate HRID (`hrid`).
        
        3. **Custom Hours Mode (`request_unit_hours: true`)**:
           - Enables requesting fractional / partial days by specific hours.
           - `request_hour_from` and `request_hour_to` can be provided as decimal numbers (e.g., `8.5` for 08:30, `16.0` for 16:00) or `"HH:MM"` formatted strings (e.g., `"08:30"`, `"16:00"`).
           - `request_date_to` is optional in hours mode (defaults to `request_date_from`).
           - `request_hour_from` must be strictly earlier than `request_hour_to`.
        
        4. **Full Days Mode (`request_unit_hours: false`)**:
           - Standard daily leave spanning from `request_date_from` to `request_date_to`.
        
        5. **Schedule-Independent Allocation Deduction (`ignore_working_schedule`)**:
           - In standard Odoo, leave requests on non-working days (weekends, off-days) or outside shift hours evaluate to 0 hours/days, preventing proper allocation deduction.
           - **This integration guarantees deduction regardless of the employee's working schedule/calendar.** The requested duration is strictly computed and deducted from the employee's allocation balance.
        
        6. **Direct Validation / Auto-Approval**:
           - Set `validate: true` (or `auto_approve: true`) in the request payload to immediately approve and validate the leave request (`state: 'validate'`).
           - If false, the record is created in `confirm` state for manager review.
        
        7. **Response Data**:
           - Returns `duration_display` (e.g. `"1.00 days"`, `"3.00 hours"`), `number_of_days`, `number_of_hours`, `date_from`, `date_to` (UTC datetime), and full record details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOffUpsertInput'
      responses:
        '200':
          description: Time off request created or updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/TimeOffRecord'
        '400':
          description: Validation error (e.g. inverted dates/hours, insufficient allocation, validation rejected by Odoo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Employee, leave type, or leave record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/timeoff/cancel:
    post:
      tags: [Time Off]
      summary: Cancel or refuse an employee time off request
      description: |
        Cancels or refuses a requested or approved time off request (`hr.leave`), automatically releasing and restoring the deducted days or hours back to the employee's allocation balance.
        
        **Important Cases & Behavior:**
        1. **Cancel (`action: 'cancel'`) - Default**:
           - Cancels the time off request, removes resource calendar leaves, and frees up calendar appointments.
           - Restores deducted days/hours to the allocation.
        2. **Refuse (`action: 'refuse'`)**:
           - Sets status to 'refuse' (Manager refusal).
           - Can only be executed on requests in `confirm`, `validate`, or `validate1` state.
        3. **Reason Justification**:
           - Optional `reason` parameter is recorded in the record chatter / message thread.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeOffCancelInput'
      responses:
        '200':
          description: Time off request cancelled or refused successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    $ref: '#/components/schemas/TimeOffCancelRecord'
        '400':
          description: Invalid parameters, request already cancelled/refused, or invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Time off record not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

